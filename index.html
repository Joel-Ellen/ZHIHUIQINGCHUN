                // 构建路径数据
                const levels = [];
                if (promoData.length > 0 && promoData[0].path) {
                    // 使用真实的晋升路径
                    promoData[0].path.forEach((node, idx) => {
                        levels.push({
                            title: node.name || `层级${idx+1}`,
                            years: idx === 0 ? '0-2年' : idx === 1 ? '3-5年' : idx === 2 ? '5-8年' : '8年+',
                            skills: networkData?.skills?.slice(0, 3).map(s => s.name) || ['核心技能'],
                            salary: '参考数据集',
                            description: node.name ? `${node.name}发展路径` : '职业发展阶段'
                        });
                    });
                }
                
                // 如果路径不足4个，补充默认层级
                const defaultTitles = ['初级岗位', '中级岗位', '高级岗位', '专家/管理'];
                while (levels.length < 4) {
                    const idx = levels.length;
                    levels.push({
                        title: defaultTitles[idx] || '资深专家',
                        years: idx === 0 ? '0-2年' : idx === 1 ? '3-5年' : idx === 2 ? '5-8年' : '8年+',
                        skills: networkData?.skills?.slice(0, 3).map(s => s.name) || ['核心技能'],
                        salary: `${(8+idx*15)}K-${(15+idx*20)}K`,
                        description: `${defaultTitles[idx]}发展阶段`
                    });
                }
                
                // 构建转岗建议
                const transitions = [];
                if (networkData?.transition_targets) {
                    networkData.transition_targets.slice(0, 3).forEach(t => {
                        transitions.push({ from: jobName, to: t.name, reason: '技能重叠度高，可平滑转岗' });
                    });
                }
                if (networkData?.similar_jobs) {
                    networkData.similar_jobs.slice(0, 2).forEach(s => {
                        transitions.push({ from: jobName, to: s.name, reason: '岗位相似度高' });
                    });
                }
                if (transitions.length === 0) {
                    transitions.push({ from: jobName, to: '相关领域专家', reason: '专业技能深度发展' });
                }
                
                // 构建技能提升建议
                const skillItems = networkData?.skills ? networkData.skills.slice(0, 5).map(s => s.name) : ['核心技能'];
                
                setCareerPath({
                    job: jobName,
                    levels: levels.slice(0, 4),
                    transitions: transitions.slice(0, 4),
                    suggestions: [
                        { type: '核心技能', items: skillItems },
                        { type: '发展建议', items: ['持续学习新技术', '积累项目经验', '建立专业影响力'] }
                    ],
                    _fromKG: !!networkData,
                });
                setIsGenerating(false);
                setLoading(false);
            };
            
            const handleJobChange = (e) => {
                const jobName = e.target.value;
                setSelectedJob(jobName);
                if (jobName) {
                    generateCareerPath(jobName);
                } else {
                    setCareerPath(null);
                }
            };
            
            useEffect(() => {
                if (chartRef.current && careerPath) {
                    const chart = echarts.init(chartRef.current);
                    
                    // 使用 canvas 测量文本宽度，计算自适应圆形节点大小
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    ctx.font = '12px sans-serif';
                    let currentX = 100;
                    const mainNodes = careerPath.levels.map((level, index) => {
                        const textWidth = ctx.measureText(level.title).width;
                        const symbolSize = Math.max(textWidth + 28, 60);
                        const nodeX = currentX + symbolSize / 2;
                        currentX += symbolSize + 60;
                        return {
                            name: level.title,
                            value: index,
                            x: nodeX,
                            y: 200,
                            symbolSize: symbolSize,
                            itemStyle: { color: index === 0 ? '#9CCC65' : index === careerPath.levels.length - 1 ? '#558B2F' : '#7CB342' },
                            label: { show: true, position: 'inside', formatter: '{b}', fontSize: 12, color: '#fff' },
                            draggable: true,
                            category: 'main'
                        };
                    });
                    
                    // 构建晋升连线
                    const promotionLinks = careerPath.levels.slice(0, -1).map((level, index) => ({
                        source: level.title,
                        target: careerPath.levels[index + 1].title,
                        lineStyle: { color: '#7CB342', width: 3, curveness: 0.2, type: 'solid' },
                        label: { show: true, formatter: '晋升', fontSize: 10, color: '#7CB342' }
                    }));
                    
                    // 构建转岗节点和转岗连线
                    const transitionNodes = [];
                    const transitionLinks = [];
                    const transitions = careerPath.transitions || [];
                    
                    transitions.forEach((t, idx) => {
                        const fromNode = mainNodes.find(n => n.name === t.from);
                        if (fromNode) {
                            const transTextWidth = ctx.measureText(t.to).width;
                            const transSymbolSize = Math.max(transTextWidth + 28, 60);
                            const transNode = {
                                name: t.to,
                                value: `转岗: ${t.reason}`,
                                x: fromNode.x + (idx % 2 === 0 ? -40 : 40),
                                y: fromNode.y + 120,
                                symbolSize: transSymbolSize,
                                itemStyle: { 
                                    color: '#FF8F00',
                                    shadowBlur: 10,
                                    shadowColor: 'rgba(255,143,0,0.3)'
                                },
                                label: { show: true, position: 'inside', formatter: '{b}', fontSize: 11, color: '#fff' },
                                draggable: true,
                                category: 'transition'
                            };
                            transitionNodes.push(transNode);
                            transitionLinks.push({
                                source: t.from,
                                target: t.to,
                                lineStyle: { 
                                    color: '#FF8F00', 
                                    width: 2, 
                                    curveness: 0.3, 
                                    type: 'dashed' 
                                },
                                label: { show: true, formatter: '转岗', fontSize: 10, color: '#FF8F00' }
                            });
                        }
                    });
                    
                    const allNodes = [...mainNodes, ...transitionNodes];
                    const allLinks = [...promotionLinks, ...transitionLinks];
                    
                    const option = {
                        tooltip: { 
                            trigger: 'item', 
                            backgroundColor: 'rgba(255,255,255,0.95)', 
                            borderColor: '#E0E0E0', 
                            padding: [12, 16], 
                            textStyle: { color: '#212121', fontSize: 13 },
                            formatter: (params) => {
                                if (params.dataType === 'node') {
                                    const isTrans = params.data.category === 'transition';
                                    return `<div style="font-weight:700;margin-bottom:6px;">${params.name}</div><div style="color:${isTrans ? '#FF8F00' : '#7CB342'};font-size:12px;">${isTrans ? '转岗方向' : '晋升节点'}</div>${params.value ? `<div style="margin-top:4px;color:#666;font-size:12px;">${params.value}</div>` : ''}`;
                                }
                                return params.name;
                            }
                        },
                        legend: {
                            data: ['晋升路径', '转岗路径'],
                            bottom: 10,
                            textStyle: { color: '#666', fontSize: 12 }
                        },
                        series: [{
                            type: 'graph', layout: 'none', roam: true,
                            emphasis: { focus: 'adjacency', lineStyle: { width: 4 } },
                            data: allNodes,
                            links: allLinks
                        }]
                    };
                    chart.setOption(option, true);
                }
            }, [careerPath]);

            return (
                <div>
                    <div className="page-header graph">
                        <div className="page-header-bg">
                            <div className="page-circle page-circle-1"></div>
                            <div className="page-circle page-circle-2"></div>
                            <div className="page-circle page-circle-3"></div>
                            <div className="page-particles">
                                {[1,2,3,4,5,6,7,8].map(i => <div key={i} className="page-particle"></div>)}
                            </div>
                            <div className="page-grid"></div>
                            <div className="page-glow"></div>
                        </div>
                        <div className="page-header-content">
                            <div className="page-icon"><Icon name="network" size={36} /></div>
                            <h1 className="page-title">职业路线规划</h1>
                            <p className="page-desc">AI智能规划职业发展路径，清晰展示晋升路线</p>
                        </div>
                    </div>
                    <div className="page-content">
                        <div className="container">
                            <div className="career-select-section">
                                <div className="career-select-card">
                                    <h3><Icon name="target" size={20} /> 选择目标岗位</h3>
                                    <p className="career-select-hint">从简历分析推荐的岗位中选择，或搜索其他岗位</p>
                                    <div className="career-select-wrapper">
                                        <select className="career-select" value={selectedJob} onChange={handleJobChange}>
                                            <option value="">-- 请选择目标岗位 --</option>
                                            {userRecommendedJobs.length > 0 && (
                                                <optgroup label="简历分析推荐">
                                                    {userRecommendedJobs.map((job, i) => (
                                                        <option key={i} value={typeof job === 'string' ? job : job.name}>
                                                            {typeof job === 'string' ? job : job.name} {job.match ? `(${job.match}%)` : ''}
                                                        </option>
                                                    ))}
                                                </optgroup>
                                            )}
                                            <optgroup label="热门岗位">
                                                {allJobs.map((job, i) => (
                                                    <option key={i} value={job}>{job}</option>
                                                ))}
                                            </optgroup>
                                        </select>
                                    </div>
                                    {selectedJob && (
                                        <div className="career-selected-info">
                                            <Icon name="check" size={16} /> 已选择: <strong>{selectedJob}</strong>
                                        </div>
                                    )}
                                </div>
                            </div>
                            {loading ? (
                                <div className="career-loading">
                                    <div className="career-spinner"></div>
                                    <p>AI正在为您生成职业发展路线...</p>
                                </div>
                            ) : careerPath ? (
                                <div className="career-content">
                                    <div className="career-path-section">
                                        <h2 className="section-title"><Icon name="map" size={24} /> {careerPath.job} 发展路线</h2>
                                        <div className="career-roadmap">
                                            {careerPath.levels.map((level, index) => (
                                                <div key={index} className={`career-level ${index === 0 ? 'entry' : index === careerPath.levels.length - 1 ? 'target' : 'mid'}`}>
                                                    <div className="career-level-marker">
                                                        <div className="career-level-number">{index + 1}</div>
                                                        <div className="career-level-line"></div>
                                                    </div>
                                                    <div className="career-level-card">
                                                        <div className="career-level-header">
                                                            <h4>{level.title}</h4>
                                                            <span className="career-level-years">{level.years}</span>
                                                        </div>
                                                        <div className="career-level-salary">
                                                            <Icon name="dollar" size={14} /> {level.salary}
                                                        </div>
                                                        <p className="career-level-desc">{level.description}</p>
                                                        <div className="career-level-skills">
                                                            {level.skills.map((skill, i) => (
                                                                <span key={i} className="career-skill-tag">{skill}</span>
                                                            ))}
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    
                                    <div className="career-suggestions">
                                        <h2 className="section-title"><Icon name="lightbulb" size={24} /> 发展建议</h2>
                                        <div className="suggestions-grid">
                                            {careerPath.suggestions.map((group, i) => (
                                                <div key={i} className="suggestion-card">
                                                    <h4><Icon name={i === 0 ? 'star' : 'compass'} size={18} /> {group.type}</h4>
                                                    <ul>
                                                        {group.items.map((item, j) => (
                                                            <li key={j}><Icon name="check" size={14} /> {item}</li>
                                                        ))}
                                                    </ul>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <div className="career-empty">
                                    <Icon name="target" size={64} />
                                    <h3>开始您的职业规划</h3>
                                    <p>从上方选择目标岗位，AI将为您生成详细的职业发展路线</p>
                                    <div className="career-tips">
                                        <h4>使用提示</h4>
                                        <ul>
                                            <li><Icon name="file" size={16} /> 建议先完成简历分析，系统将为您推荐匹配的岗位</li>
                                            <li><Icon name="sparkle" size={16} /> AI将根据您的选择生成个性化的职业发展路线</li>
                                            <li><Icon name="rocket" size={16} /> 每个阶段都包含薪资范围和核心技能要求</li>
                                        </ul>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // 主应用
        function App() {
            const [currentPage, setCurrentPage] = useState('home');
            const [selectedJob, setSelectedJob] = useState(null);
            const [user, setUser] = useState(null);
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [authMode, setAuthMode] = useState('login');
            const [toast, setToast] = useState(null);

            useEffect(() => {
                const savedUser = localStorage.getItem('smartCareerUser');
                if (savedUser) setUser(JSON.parse(savedUser));
            }, []);

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3000);
            };

            const handleLogin = async (email, password) => {
                const response = await window.API.loginUser(email, password);
                if (response.success && response.data) {
                    const userData = {
                        id: response.data.id,
                        username: response.data.username,
                        email: response.data.email
                    };
                    setUser(userData);
                    localStorage.setItem('smartCareerUser', JSON.stringify(userData));
                    setShowAuthModal(false);
                    showToast('登录成功！欢迎回来 ' + userData.username, 'success');
                    return true;
                }

                // 后端不可用时回退到本地存储方案
                const users = JSON.parse(localStorage.getItem('smartCareerUsers') || '[]');
                const foundUser = users.find(u => u.email === email && u.password === password);
                if (foundUser) {
                    const userData = { id: foundUser.id || email, username: foundUser.name, email: foundUser.email };
                    setUser(userData);
                    localStorage.setItem('smartCareerUser', JSON.stringify(userData));
                    setShowAuthModal(false);
                    showToast('登录成功（本地模式）！欢迎回来 ' + foundUser.name, 'success');
                    return true;
                }

                showToast(response.error || '邮箱或密码错误', 'error');
                return false;
            };

            const handleRegister = async (name, email, password) => {
                const response = await window.API.registerUser(name, email, password);
                if (response.success && response.data) {
                    const userData = {
                        id: response.data.id,
                        username: response.data.username,
                        email: response.data.email
                    };
                    setUser(userData);
                    localStorage.setItem('smartCareerUser', JSON.stringify(userData));
                    setShowAuthModal(false);
                    showToast('注册成功！欢迎加入智绘青春', 'success');
                    return true;
                }

                // 后端不可用时回退到本地存储方案
                const users = JSON.parse(localStorage.getItem('smartCareerUsers') || '[]');
                if (users.find(u => u.email === email)) {
                    showToast('该邮箱已被注册', 'error');
                    return false;
                }
                const fallbackUser = { id: email, name, email, password, createdAt: new Date().toISOString() };
                users.push(fallbackUser);
                localStorage.setItem('smartCareerUsers', JSON.stringify(users));
                const userData = { id: fallbackUser.id, username: fallbackUser.name, email: fallbackUser.email };
                setUser(userData);
                localStorage.setItem('smartCareerUser', JSON.stringify(userData));
                setShowAuthModal(false);
                showToast('注册成功（本地模式）！欢迎加入智绘青春', 'success');
                return true;
            };

            const handleLogout = () => {
                setUser(null);
                localStorage.removeItem('smartCareerUser');
                showToast('已退出登录', 'info');
            };

            const handleNavigate = (page, job = null) => {
                // 需要登录的页面列表
                const authRequiredPages = ['resume', 'report', 'graph', 'quiz'];
                
                // 检查是否需要登录
                if (authRequiredPages.includes(page) && !user) {
                    showToast('请先登录后再使用此功能', 'info');
                    setAuthMode('login');
                    setShowAuthModal(true);
                    return;
                }
                
                if (job) setSelectedJob(job);
                setCurrentPage(page);
                window.scrollTo(0, 0);
            };

            const renderPage = () => {
                switch (currentPage) {
                    case 'home': return <HomePage onNavigate={handleNavigate} />;
                    case 'jobs': return <JobsPage onNavigate={handleNavigate} />;
                    case 'resume': return <ResumePage onNavigate={handleNavigate} user={user} />;
                    case 'quiz': return <QuizPage onNavigate={handleNavigate} user={user} />;
                    case 'report': return <ReportPage selectedJob={selectedJob} onNavigate={handleNavigate} user={user} />;
                    case 'profile': return <ProfilePage onNavigate={handleNavigate} user={user} />;
                    case 'graph': return <GraphPage />;
                    default: return <HomePage onNavigate={handleNavigate} />;
                }
            };

            return (
                <div>
                    <Header currentPage={currentPage} onNavigate={handleNavigate} user={user}
                        onLogin={() => { setAuthMode('login'); setShowAuthModal(true); }}
                        onLogout={handleLogout}
                    />
                    <main className="main-content">{renderPage()}</main>
                    <Footer onNavigate={handleNavigate} />
                    {showAuthModal && (
                        <AuthModal mode={authMode} onClose={() => setShowAuthModal(false)}
                            onLogin={handleLogin} onRegister={handleRegister}
                            onSwitchMode={() => setAuthMode(authMode === 'login' ? 'register' : 'login')}
                        />
                    )}
                    {toast && <div className={`toast ${toast.type}`}>{toast.message}</div>}
                </div>
            );
        }

        function AuthModal({ mode, onClose, onLogin, onRegister, onSwitchMode }) {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [name, setName] = useState('');
            const [confirmPwd, setConfirmPwd] = useState('');
            const [errors, setErrors] = useState({});
            const [loading, setLoading] = useState(false);

            const validate = () => {
                const errs = {};
                if (!email) errs.email = '请输入邮箱';
                else if (!/\S+@\S+\.\S+/.test(email)) errs.email = '邮箱格式不正确';
                if (!password) errs.password = '请输入密码';
                else if (password.length < 6) errs.password = '密码至少6位';
                if (mode === 'register') {
                    if (!name) errs.name = '请输入姓名';
                    if (password !== confirmPwd) errs.confirmPwd = '两次密码不一致';
                }
                setErrors(errs);
                return Object.keys(errs).length === 0;
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!validate()) return;
                setLoading(true);
                const success = await (mode === 'login' ? onLogin(email, password) : onRegister(name, email, password));
                setLoading(false);
                if (success) {
                    setEmail('');
                    setPassword('');
                    setName('');
                    setConfirmPwd('');
                    setErrors({});
                }
            };

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal-content" onClick={e => e.stopPropagation()}>
                        <button className="modal-close" onClick={onClose}>
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2">
                                <line x1="18" y1="6"x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                            </svg>
                        </button>
                        <h2 className="modal-title">{mode === 'login' ? '欢迎回来' : '加入智绘青春'}</h2>
                        <p className="modal-subtitle">{mode === 'login' ? '登录账户，开始你的职业规划之旅' : '创建账户，获取个性化职业规划服务'}</p>
                        <form onSubmit={handleSubmit}>
                            {mode === 'register' && (
                                <div className="form-group">
                                    <label className="form-label">姓名</label>
                                    <input type="text" className={`form-input ${errors.name ? 'error' : ''}`} placeholder="请输入你的姓名" value={name} onChange={e => setName(e.target.value)} />
                                    {errors.name && <div className="form-error">{errors.name}</div>}
                                </div>
                            )}
                            <div className="form-group">
                                <label className="form-label">邮箱</label>
                                <input type="email" className={`form-input ${errors.email ? 'error' : ''}`} placeholder="请输入邮箱地址" value={email} onChange={e => setEmail(e.target.value)} />
                                {errors.email && <div className="form-error">{errors.email}</div>}
                            </div>
                            <div className="form-group">
                                <label className="form-label">密码</label>
                                <input type="password" className={`form-input ${errors.password ? 'error' : ''}`} placeholder="请输入密码" value={password} onChange={e => setPassword(e.target.value)} />
                                {errors.password && <div className="form-error">{errors.password}</div>}
                            </div>
                            {mode === 'register' && (
<div className="form-group">
                                    <label className="form-label">确认密码</label>
                                    <input type="password" className={`form-input ${errors.confirmPwd ? 'error' : ''}`} placeholder="请再次输入密码" value={confirmPwd} onChange={e => setConfirmPwd(e.target.value)} />
                                    {errors.confirmPwd && <div className="form-error">{errors.confirmPwd}</div>}
                                </div>
                            )}
                            <button type="submit" className="form-submit" disabled={loading}>{loading ? '处理中...' : (mode === 'login' ? '登录' : '注册')}</button>
                        </form>
                        <div className="form-switch">
                            {mode === 'login' ? (<>还没有账户？<a onClick={onSwitchMode}>立即注册</a></>) : (<>已有账户？<a onClick={onSwitchMode}>立即登录</a></>)}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>

<style>

  margin: 0;
  padding: 0;
  box-sizing: border-box;

  position: relative;
}

  display: flex;
  flex-wrap: wrap;

.career-tips li { display: flex; align-items: center; gap: 12px; padding: 10px 0; font-size: 14px; color: var(--text-secondary); border-bottom: 1px solid rgba(124,179,66,0.2); }
.career-tips li:last-child { border-bottom: none; }
.career-tips li svg { color: var(--primary); flex-shrink: 0; }

/* ============================================
   KG4Career岗位画像CSS
   ============================================ */

/* 操作栏 */
.profile-action-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: linear-gradient(135deg, rgba(124,179,66,0.08) 0%, rgba(255,179,0,0.05) 100%);
    border: 1px solid rgba(124,179,66,0.15);
    border-radius: 12px;
    margin-bottom: 20px;
}

/* 岗位卡片网格 */
.profile-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
    margin-bottom: 32px;
}

/* 岗位卡片 */
.profile-card {
    background: white;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
}

.profile-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(124,179,66,0.15);
    border-color: var(--primary);
}

.profile-card.has-profile {
    border-color: rgba(124,179,66,0.2);
}

.profile-indicator {
    position: absolute;
    top: 12px;
    right: 12px;
    color: var(--success);
}

.profile-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
}

.profile-icon {
    width: 48px;
    height: 48px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
}

.profile-match {
    text-align: right;
}

.profile-match .match-percent {
    font-size: 24px;
    font-weight: 700;
    color: var(--primary);
}

.profile-match .match-text {
    font-size: 12px;
    color: var(--text-muted);
}

.profile-card-body {
    margin-bottom: 12px;
}

.profile-name {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 6px;
}

.profile-company {
    font-size: 13px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 8px;
}

.profile-meta {
    display: flex;
    gap: 12px;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 12px;
}

.profile-meta span {
    display: flex;
    align-items: center;
    gap: 4px;
}

.profile-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

/* 迷你画像条 */
.mini-profile-bars {
    padding: 12px;
    background: var(--bg-primary);
    border-radius: 8px;
    margin-bottom: 12px;
}

.mini-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
}

.mini-bar:last-child {
    margin-bottom: 0;
}

.mini-bar-label {
    font-size: 11px;
    color: var(--text-secondary);
    width: 45px;
}

.mini-bar-track {
    flex: 1;
    height: 6px;
    background: var(--border-light);
    border-radius: 3px;
    overflow: hidden;
}

.mini-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.5s ease;
}

.mini-bar-value {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-primary);
    width: 28px;
    text-align: right;
}

.profile-card-footer {
    text-align: center;
    padding-top: 12px;
    border-top: 1px solid var(--border-light);
}

.view-detail {
    font-size: 13px;
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}

/* 分页组件 */
.pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 24px 0;
    flex-wrap: wrap;
}

.page-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 18px;
    background: white;
    border: 1px solid var(--border-medium);
    border-radius: 8px;
    font-size: 14px;
    color: var(--text-primary);
    cursor: pointer;
    transition: all 0.2s;
}

.page-btn:hover:not(:disabled) {
    border-color: var(--primary);
    color: var(--primary);
    background: var(--primary-alpha);
}

.page-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

/* 分类筛选标签 */
.category-filter-wrapper {
    position: relative;
    margin-bottom: 12px;
}

.category-scroll {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 0;
    scrollbar-width: none;
    -ms-overflow-style: none;
}

.category-scroll::-webkit-scrollbar {
    display: none;
}

.category-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    background: white;
    border: 1px solid var(--border-light);
    border-radius: 20px;
    font-size: 13px;
    color: var(--text-secondary);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
}

.category-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
    background: var(--primary-alpha);
}

.category-btn.active {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    border-color: var(--primary);
    color: white;
    font-weight: 500;
}

.category-count {
    padding: 2px 6px;
    background: rgba(0,0,0,0.08);
    border-radius: 10px;
    font-size: 11px;
}

.category-btn.active .category-count {
    background: rgba(255,255,255,0.25);
}

.page-numbers {
    display: flex;
    align-items: center;
    gap: 4px;
}

.page-num {
    min-width: 36px;
    height: 36px;
    padding: 0 8px;
    background: white;
    border: 1px solid var(--border-light);
    border-radius: 8px;
    font-size: 14px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
}

.page-num:hover {
    border-color: var(--primary);
    color: var(--primary);
}

.page-num.active {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
    font-weight: 600;
}

.page-ellipsis {
    padding: 0 4px;
    color: var(--text-muted);
}

/* 画像弹窗 */
.profile-modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    padding: 20px;
    animation: fadeIn 0.2s ease;
}

.profile-modal {
    background: white;
    border-radius: 24px;
    width: 100%;
    max-width: 900px;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
    animation: slideUp 0.3s ease;
}

.profile-modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 36px;
    height: 36px;
    border: none;
    background: var(--bg-primary);
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    transition: all 0.2s;
}

.profile-modal-close:hover {
    background: var(--border-medium);
}

.profile-modal-header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 24px;
    border-bottom: 1px solid var(--border-light);
}

.profile-modal-icon {
    width: 56px;
    height: 56px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
}

.profile-modal-info h2 {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 4px;
}

.profile-modal-info p {
    font-size: 14px;
    color: var(--text-secondary);
}

.profile-modal-content {
    padding: 24px;
}

.profile-radar-container {
    margin-bottom: 24px;
}

.profile-radar-chart {
    width: 100%;
    height: 400px;
}

.profile-dimensions {
    margin-bottom: 24px;
}

.profile-dimensions h4 {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.dimensions-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
}

.dimension-section h5 {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.dimension-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
}

.dimension-item {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
}

.dimension-name {
    font-size: 13px;
    color: var(--text-secondary);
    width: 80px;
}

.dimension-bar-wrap {
    flex: 1;
}

.dimension-bar {
    height: 8px;
    background: var(--border-light);
    border-radius: 4px;
    overflow: hidden;
}

.dimension-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.5s ease;
}

.dimension-value {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    width: 28px;
    text-align: right;
}

.profile-job-info {
    background: var(--bg-primary);
    border-radius: 12px;
    padding: 16px;
}

.profile-job-info h4 {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.info-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
    font-size: 13px;
}

.info-row:last-child {
    margin-bottom: 0;
}

.info-label {
    color: var(--text-muted);
    min-width: 50px;
}

.info-value {
    color: var(--text-primary);
}

.profile-modal-footer {
    display: flex;
    justify-content: center;
    gap: 16px;
    padding: 20px;
    border-top: 1px solid var(--border-light);
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

/* 响应式调整 */
@media (max-width: 768px) {
    .profile-grid {
        grid-template-columns: 1fr;
    }
    
    .dimensions-grid {
        grid-template-columns: 1fr;
    }
    
    .profile-modal {
        max-height: 95vh;
    }
}
